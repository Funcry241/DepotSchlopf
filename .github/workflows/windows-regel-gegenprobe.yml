name: Windows-Sammelcheck Gegenprobe
on:
  pull_request:
    branches: [maus/362-windows-testbasis]
permissions:
  contents: read
  pull-requests: read
jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.filter.outputs.update }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: filter
        run: |
          PYTHONPATH=.github/scripts python -B -c 'from windows_update import update_noetig; print("update=" + str(update_noetig("pull_request", ["docs/kaltstart.md"])).lower())' >> "$GITHUB_OUTPUT"
  gate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Gate erfolgreich (Testeingabe)"
  update:
    needs: filter
    if: ${{ needs.filter.outputs.update == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
  kodex-windows:
    needs: [filter, gate, update]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      FILTER: ${{ needs.filter.result }}
      UPDATE_NOETIG: ${{ needs.filter.outputs.update }}
      GATE: ${{ needs.gate.result }}
      UPDATE: ${{ needs.update.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Produktions-Sammelcheck mit gefiltertem Update
        shell: bash
        run: |
          printf 'filter=%s update_noetig=%s gate=%s update=%s\n' "$FILTER" "$UPDATE_NOETIG" "$GATE" "$UPDATE"
          test "$FILTER:$UPDATE_NOETIG:$GATE:$UPDATE" = 'success:false:success:skipped'
          python -B .github/scripts/windows_update.py sammelcheck
  merge-status:
    needs: kodex-windows
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_STATE: clean
    steps:
      - name: GitHub-Merge-Status erfassen
        shell: bash
        run: |
          for attempt in {1..12}; do
            data=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '{head: .head.sha, base: .base.ref, draft, mergeable, mergeable_state}')
            echo "$data"
            test "$(jq -r .head <<< "$data")" = "$EXPECTED_HEAD"
            test "$(jq -r .base <<< "$data")" = "maus/362-windows-testbasis"
            test "$(jq -r .draft <<< "$data")" = false
            if [[ $(jq -r .mergeable_state <<< "$data") = "$EXPECTED_STATE" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Erwarteter GitHub-Status: $EXPECTED_STATE"
          exit 1

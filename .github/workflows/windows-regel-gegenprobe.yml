name: Windows-Sammelcheck Gegenprobe
on:
  pull_request:
    branches: [maus/362-windows-testbasis]
permissions:
  contents: read
  pull-requests: read
jobs:
  vorjob:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 300
  kodex-windows:
    needs: vorjob
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      VORJOB: ${{ needs.vorjob.result }}
    steps:
      - run: test "$VORJOB" = success

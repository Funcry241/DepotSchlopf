name: IBKR Journalabgleich vorbereiten
on:
  push:
    branches: [maus/356-ibkr-abgleich-vorbereitung]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust-Dateien formatieren
        run: |
          cargo fmt --all
          mkdir -p "$RUNNER_TEMP/ibkr-abgleich"
          cp --parents crates/depot_sammler/src/ibkr.rs crates/depot_sammler/src/ibkr/abgleich.rs crates/depot_sammler/src/main.rs "$RUNNER_TEMP/ibkr-abgleich"
      - uses: actions/upload-artifact@v4
        with:
          name: ibkr-abgleich
          path: ${{ runner.temp }}/ibkr-abgleich
      - name: Sammler prüfen
        run: |
          cargo clippy --locked -p depot_sammler --all-targets -- -D warnings
          cargo test --locked -p depot_sammler

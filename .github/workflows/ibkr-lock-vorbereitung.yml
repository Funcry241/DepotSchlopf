name: IBKR Adapter vorbereiten
on:
  push:
    branches: [maus/356-ibkr-vorbereitung]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Kandidaten formatieren und Festschreibung berechnen
        run: |
          rm .github/workflows/ibkr-lock-vorbereitung.yml
          cargo fmt --all
          cargo run --locked -p depot_kodex -- festschreibung
          mkdir -p "$RUNNER_TEMP/ibkr-prepared"
          cp --parents Cargo.lock kodex/festschreibung.txt crates/depot_sammler/src/ibkr.rs crates/depot_sammler/src/main.rs crates/depot_lauf/src/main.rs "$RUNNER_TEMP/ibkr-prepared"
      - uses: actions/upload-artifact@v4
        with:
          name: ibkr-kandidat
          path: ${{ runner.temp }}/ibkr-prepared
      - name: Lesenden Adapter testen
        run: |
          cargo clippy --locked -p depot_sammler -p depot_lauf --all-targets -- -D warnings
          cargo test --locked -p depot_sammler -p depot_lauf

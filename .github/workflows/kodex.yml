name: Kodex

on:
  pull_request:
  push:
    branches: [main]

# Ein neuer Stand desselben PRs macht dessen alte Prüfung überflüssig.
concurrency:
  group: kodex-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-update-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      update: ${{ steps.filter.outputs.update }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gegenproben für den Windows-Update-Filter
        run: python -B .github/scripts/test_windows_update.py
      - name: Windows-Update-Gegenprobe einplanen
        id: filter
        env:
          EREIGNIS: ${{ github.event_name }}
          BASIS: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -B .github/scripts/windows_update.py filter "$EREIGNIS" "$BASIS" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  kodex-linux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Gate und Assistenten-Export (wie run.cmd)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASIS="origin/${{ github.base_ref }}"
          else
            BASIS="${{ github.event.before }}"
          fi
          cargo run --locked -p depot_lauf -- alles --basis "$BASIS"
      - name: Assistenten-Export bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant_export_latest
          path: assistant_export_latest.zip
          if-no-files-found: warn
          retention-days: 30

  kodex-linux-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache-Schlüssel für alten Updater bestimmen
        id: alt
        shell: bash
        run: |
          commit=$(python .github/scripts/pruefe_update_alt.py --alt-commit)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Alten Updater aus Cache laden
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/update-alt-bau/debug/depotschlopf
          key: update-alt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.alt.outputs.commit }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Alter Updater bei laufendem Dienst
        shell: bash
        env:
          ALT_CACHE_TREFFER: ${{ steps.cache.outputs.cache-hit }}
        run: |
          optionen=()
          if [ "$ALT_CACHE_TREFFER" = true ]; then
            optionen+=(--cache-treffer)
          fi
          python .github/scripts/pruefe_update_alt.py --isolierte-pruefmaschine --arbeit "$RUNNER_TEMP/depot-update-alt" --alt-bau "$RUNNER_TEMP/update-alt-bau" "${optionen[@]}"
      - name: Geprüften alten Updater für Folgeläufe speichern
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/update-alt-bau/debug/depotschlopf
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Protokoll der Updater-Gegenprobe bereitstellen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gegenprobe-update-linux
          path: ${{ runner.temp }}/depot-update-alt/gegenprobe.log
          if-no-files-found: ignore
          retention-days: 30

  kodex:
    # Der bisherige Linux-Check bleibt das gemeinsame Ergebnis beider Prüfungen.
    needs: [kodex-linux-gate, kodex-linux-update]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Beide Linux-Prüfungen bestätigen
        env:
          GATE: ${{ needs.kodex-linux-gate.result }}
          UPDATE: ${{ needs.kodex-linux-update.result }}
        run: |
          printf 'Linux-Gate: %s\nLinux-Update: %s\n' "$GATE" "$UPDATE"
          test "$GATE" = success && test "$UPDATE" = success

  kodex-windows-gate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Temporäre Dateien im Arbeitsbereich des Runners ablegen
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Zeilenenden beim Checkout festlegen
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Gate und Assistenten-Export unter Windows
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $basis = "origin/${{ github.base_ref }}"
          } else {
            $basis = "${{ github.event.before }}"
          }
          cargo run --locked -p depot_lauf -- alles --basis $basis
          exit $LASTEXITCODE
      - name: Windows-Assistenten-Export bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant_export_windows
          path: assistant_export_latest.zip
          if-no-files-found: warn
          retention-days: 30

  kodex-windows-update:
    needs: windows-update-filter
    if: ${{ needs.windows-update-filter.outputs.update == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Temporäre Dateien im Arbeitsbereich des Runners ablegen
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Zeilenenden beim Checkout festlegen
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache-Schlüssel für alten Updater bestimmen
        id: alt
        shell: pwsh
        run: |
          $commit = python .github/scripts/pruefe_update_alt.py --alt-commit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Alten Updater aus Cache laden
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/update-alt-bau/debug/depotschlopf.exe
          key: update-alt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.alt.outputs.commit }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Alter Updater bei laufendem Dienst
        shell: pwsh
        env:
          ALT_CACHE_TREFFER: ${{ steps.cache.outputs.cache-hit }}
        run: |
          $optionen = @()
          if ($env:ALT_CACHE_TREFFER -eq "true") {
            $optionen += "--cache-treffer"
          }
          python .github/scripts/pruefe_update_alt.py --isolierte-pruefmaschine --arbeit "$env:RUNNER_TEMP/depot-update-alt" --alt-bau "$env:RUNNER_TEMP/update-alt-bau" @optionen
          exit $LASTEXITCODE
      - name: Geprüften alten Updater für Folgeläufe speichern
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/update-alt-bau/debug/depotschlopf.exe
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Protokoll der Updater-Gegenprobe bereitstellen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gegenprobe-update-windows
          path: ${{ runner.temp }}/depot-update-alt/gegenprobe.log
          if-no-files-found: ignore
          retention-days: 30

  kodex-windows:
    # Der bisherige Windows-Check bleibt das gemeinsame Ergebnis beider Prüfungen.
    needs: [windows-update-filter, kodex-windows-gate, kodex-windows-update]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Beide Windows-Prüfungen bestätigen
        env:
          FILTER: ${{ needs.windows-update-filter.result }}
          UPDATE_NOETIG: ${{ needs.windows-update-filter.outputs.update }}
          GATE: ${{ needs.kodex-windows-gate.result }}
          UPDATE: ${{ needs.kodex-windows-update.result }}
        run: python -B .github/scripts/windows_update.py sammelcheck

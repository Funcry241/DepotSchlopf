name: Kodex

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kodex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASIS="origin/${{ github.base_ref }}"
          else
            BASIS="${{ github.event.before }}"
          fi
          cargo run --locked -p depot_kodex -- --basis "$BASIS" --voll

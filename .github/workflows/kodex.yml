name: Kodex

on:
  pull_request:
  push:
    branches: [main]

# Ein neuer Stand desselben PRs macht dessen alte Prüfung überflüssig.
concurrency:
  group: kodex-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kodex-tor:
    permissions:
      actions: read
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      start: ${{ steps.beobachten.outputs.start }}
      reason: ${{ steps.beobachten.outputs.reason }}
    steps:
      - name: Startfreigabe aus der Basis prüfen
        id: beobachten
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time

          def ergebnis(start, grund):
              print(f"start={start} reason={grund}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as ausgabe:
                  print(f"start={start}\nreason={grund}", file=ausgabe)

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              ergebnis("true", "push")
              raise SystemExit
          if os.environ["BASE_REF"] != "main":
              ergebnis("false", "basis-nicht-main")
              raise SystemExit

          repo = os.environ["GITHUB_REPOSITORY"]
          server = os.environ["GITHUB_SERVER_URL"]
          api_url = os.environ["GITHUB_API_URL"]
          head = os.environ["HEAD_SHA"]
          basis = os.environ["BASE_SHA"]
          if not all(re.fullmatch(r"[a-f0-9]{40}", sha) for sha in (head, basis)):
              raise ValueError("Vollständige Head- und Basis-SHA erforderlich")
          frist = time.monotonic() + 90
          hinweise = set()

          def hinweis(text):
              if text not in hinweise:
                  hinweise.add(text)
                  print(text, flush=True)

          def api(pfad, vorgang, *, protokoll=False):
              rest = frist - time.monotonic()
              if rest <= 0:
                  return None
              try:
                  # curl sendet Authorization bei einer Weiterleitung auf einen
                  # anderen Host nicht mit. Das Log liegt hinter einer solchen URL.
                  frist_abruf = min(15 if protokoll else 8, rest)
                  abruf = subprocess.run(
                      ["curl", "--silent", "--show-error", "--fail", "--location",
                       "--proto", "=https", "--proto-redir", "=https", "--max-redirs", "2",
                       "--header", "@-", f"{api_url}/repos/{repo}/{pfad}"],
                      input=f'Authorization: Bearer {os.environ["GH_TOKEN"]}\n',
                      capture_output=True, text=True, encoding="utf-8", errors="replace",
                      check=True, timeout=frist_abruf,
                  )
                  return abruf.stdout if protokoll else json.loads(abruf.stdout)
              except subprocess.CalledProcessError as fehler:
                  status = re.search(r"returned error: ([0-9]{3})", fehler.stderr)
                  hinweis(f"{vorgang}: HTTP {status[1]}" if status else f"{vorgang}: curl {fehler.returncode}")
              except subprocess.TimeoutExpired:
                  hinweis(f"{vorgang}: Abrufzeit überschritten")
              except ValueError:
                  hinweis(f"{vorgang}: ungültige API-Antwort")
              return None

          def alter_nachweis(pfad, versuch, zustand):
              # Der erste Tor-PR sieht noch den Basisworkflow vor dieser Änderung.
              jobs = api(f"{pfad}/attempts/{versuch}/jobs", "Basisjobs") or {}
              job = next((j for j in jobs.get("jobs", []) if j["name"] == "pruefe"), {})
              if not isinstance(job.get("id"), int) or job.get("conclusion") != zustand:
                  hinweis("Basisjobs: kein passender abgeschlossener Prüfjob")
                  return None
              log = api(f"actions/jobs/{job['id']}/logs", "Basisprotokoll", protokoll=True)
              if log is None:
                  return None
              log = re.sub(r"\x1b\[[0-9;]*m", "", log)
              binaufruf = re.search(
                  r"Running \`target/debug/depot_kodex pruefe-pr --basis ([a-f0-9]{40}) "
                  r"--kandidat ([a-f0-9]{40})\`", log,
              )
              if not binaufruf or binaufruf[2] != head:
                  hinweis("Basisprotokoll: kein Basis-Kodex-Aufruf für diesen Head")
                  return None
              meldungen = re.findall(r"(?m)^(?:\S+ )?\[Kodex\] (.+)$", log)
              offen = meldungen == ['Grenzfreigabe: erteilt ist "offen"']
              return binaufruf[1], "ok" if zustand == "success" else ("offen" if offen else "fehler")

          def basisnachweis():
              statuses = api(f"commits/{head}/statuses?per_page=100", "Basisstatus") or []
              status = next((s for s in statuses if s["context"] == "kodex-basis"), {})
              zustand = status.get("state")
              if zustand not in ("success", "failure"):
                  return None
              if (status.get("creator") or {}).get("login") != "github-actions[bot]":
                  hinweis("Basisstatus: unerwarteter Herausgeber")
                  return None
              ziel = re.fullmatch(
                  re.escape(f"{server}/{repo}/actions/runs/") + r"([0-9]+)",
                  status.get("target_url") or "",
              )
              if not ziel:
                  hinweis("Basisstatus: unerwarteter Lauf-Link")
                  return None
              pfad = f"actions/runs/{ziel[1]}"
              lauf = api(pfad, "Basislauf") or {}
              if (lauf.get("event"), lauf.get("path"), lauf.get("head_sha"),
                  lauf.get("status"), lauf.get("conclusion")) != (
                  "pull_request_target", ".github/workflows/kodex-basis.yml", head,
                  "completed", zustand,
              ):
                  hinweis("Basislauf: Laufmetadaten passen noch nicht zum Basisstatus")
                  return None
              versuch = lauf["run_attempt"]
              beschreibung = status.get("description")
              if not beschreibung:
                  return alter_nachweis(pfad, versuch, zustand)
              nachweis = re.fullmatch(
                  r"head=([a-f0-9]{40}) basis=([a-f0-9]{40}) R30=(ok|offen|fehler) versuch=([0-9]+)",
                  beschreibung,
              )
              if (nachweis and nachweis[1] == head and nachweis[4] == str(versuch)
                  and (nachweis[3] == "ok") == (zustand == "success")):
                  return nachweis[2], nachweis[3]
              return None

          grund = "basis-unbestimmt"
          while time.monotonic() < frist:
              nachweis = basisnachweis()
              if nachweis:
                  verwendete_basis, r30 = nachweis
                  if verwendete_basis == basis:
                      resultate = {
                          "ok": ("true", "basis-gruen"),
                          "offen": ("false", "R30-offen"),
                          "fehler": ("false", "basis-fehler"),
                      }
                      ergebnis(*resultate[r30])
                      break
                  grund = "basis-bewegt"
              time.sleep(max(0, min(5, frist - time.monotonic())))
          else:
              ergebnis("false", grund)
          PY

  kodex-nachweis:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      wiederverwendet: ${{ steps.ergebnis.outputs.wiederverwendet }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Geprüften Export für identischen Baum suchen
        id: suche
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/kodex_nachweis.py export
      - name: Geprüften Assistenten-Export übernehmen
        id: export
        if: steps.suche.outputs.lauf != ''
        uses: actions/upload-artifact@v6
        with:
          name: assistant_export_latest
          path: ${{ runner.temp }}/kodex-export/assistant_export_latest.zip
          if-no-files-found: error
          retention-days: 30
      - name: Lauf dokumentieren
        id: ergebnis
        if: steps.export.outcome == 'success'
        env:
          PR_LAUF: ${{ steps.suche.outputs.lauf }}
        run: |
          printf 'Vollständige Prüfung und Export aus PR-Lauf [%s](%s/%s/actions/runs/%s) übernommen. Die ZIP-Datei nennt den geprüften PR-Commit.\n' \
            "$PR_LAUF" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PR_LAUF" >> "$GITHUB_STEP_SUMMARY"
          echo 'wiederverwendet=ja' >> "$GITHUB_OUTPUT"

  windows-update-filter:
    needs: [kodex-tor, kodex-nachweis]
    if: ${{ !cancelled() && needs.kodex-tor.outputs.start == 'true' && needs.kodex-nachweis.outputs.wiederverwendet != 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      update: ${{ steps.filter.outputs.update }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gegenproben für Kodex-Tor und Windows-Update-Filter
        run: |
          python -B .github/scripts/test_kodex_tor.py .github/workflows/kodex.yml
          python -B .github/scripts/test_windows_update.py
          python -B .github/scripts/test_kodex_nachweis.py
      - name: Windows-Update-Gegenprobe einplanen
        id: filter
        env:
          EREIGNIS: ${{ github.event_name }}
        run: |
          if [ "$EREIGNIS" = pull_request ]; then
            BASIS=$(python -B .github/scripts/kodex_nachweis.py basis)
            python -B .github/scripts/windows_update.py filter "$EREIGNIS" "$BASIS" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            python -B .github/scripts/windows_update.py filter "$EREIGNIS" >> "$GITHUB_OUTPUT"
          fi

  kodex-linux-gate:
    needs: [kodex-tor, kodex-nachweis]
    if: ${{ !cancelled() && needs.kodex-tor.outputs.start == 'true' && needs.kodex-nachweis.outputs.wiederverwendet != 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: JavaScript der Oberfläche prüfen
        run: node --check crates/depot_dienst/src/assets/app.js
      - name: Gate und Assistenten-Export (wie run.cmd)
        env:
          BASIS: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASIS=$(python -B .github/scripts/kodex_nachweis.py basis)
          fi
          cargo run --locked -p depot_lauf -- alles --basis "$BASIS"
      - name: Assistenten-Export bereitstellen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: assistant_export_latest
          path: assistant_export_latest.zip
          if-no-files-found: warn
          retention-days: 30

  kodex-linux-update:
    needs: [kodex-tor, kodex-nachweis]
    if: ${{ !cancelled() && needs.kodex-tor.outputs.start == 'true' && needs.kodex-nachweis.outputs.wiederverwendet != 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache-Schlüssel für alten Updater bestimmen
        id: alt
        shell: bash
        run: |
          commit=$(python .github/scripts/pruefe_update_alt.py --alt-commit)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Alten Updater aus Cache laden
        id: cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/update-alt-bau/debug/depotschlopf
          key: update-alt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.alt.outputs.commit }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Alter Updater bei laufendem Dienst
        shell: bash
        env:
          ALT_CACHE_TREFFER: ${{ steps.cache.outputs.cache-hit }}
        run: |
          optionen=()
          if [ "$ALT_CACHE_TREFFER" = true ]; then
            optionen+=(--cache-treffer)
          fi
          python .github/scripts/pruefe_update_alt.py --isolierte-pruefmaschine --arbeit "$RUNNER_TEMP/depot-update-alt" --alt-bau "$RUNNER_TEMP/update-alt-bau" "${optionen[@]}"
      - name: Geprüften alten Updater für Folgeläufe speichern
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/update-alt-bau/debug/depotschlopf
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Protokoll der Updater-Gegenprobe bereitstellen
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gegenprobe-update-linux
          path: ${{ runner.temp }}/depot-update-alt/gegenprobe.log
          if-no-files-found: ignore
          retention-days: 30

  kodex:
    # Der bisherige Linux-Check bleibt das gemeinsame Ergebnis beider Prüfungen.
    needs: [kodex-tor, kodex-nachweis, kodex-linux-gate, kodex-linux-update]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Startfreigabe des Kodex-Tors prüfen
        env:
          TOR: ${{ needs.kodex-tor.result }}
          TOR_START: ${{ needs.kodex-tor.outputs.start }}
          TOR_GRUND: ${{ needs.kodex-tor.outputs.reason }}
        run: |
          printf 'Kodex-Tor: %s, Start: %s, Grund: %s\n' "$TOR" "$TOR_START" "$TOR_GRUND"
          test "$TOR" = success && test "$TOR_START" = true
      - name: Identischen grünen PR-Lauf übernehmen
        if: needs.kodex-nachweis.outputs.wiederverwendet == 'ja'
        run: echo "Linux-Prüfungen aus vollständig grünem PR-Lauf übernommen."
      - name: Beide Linux-Prüfungen bestätigen
        if: needs.kodex-nachweis.outputs.wiederverwendet != 'ja'
        env:
          GATE: ${{ needs.kodex-linux-gate.result }}
          UPDATE: ${{ needs.kodex-linux-update.result }}
        run: |
          printf 'Linux-Gate: %s\nLinux-Update: %s\n' "$GATE" "$UPDATE"
          test "$GATE" = success && test "$UPDATE" = success

  kodex-windows-gate:
    needs: [kodex-tor, kodex-nachweis]
    if: ${{ !cancelled() && needs.kodex-tor.outputs.start == 'true' && needs.kodex-nachweis.outputs.wiederverwendet != 'ja' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Temporäre Dateien im Arbeitsbereich des Runners ablegen
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Zeilenenden beim Checkout festlegen
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Bauordner des Gates bestimmen
        id: bauordner
        shell: pwsh
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        run: ./.github/scripts/kodex_baucache.ps1 -Art gate
      - name: Bauordner aus Cache laden
        id: gate-baucache
        if: ${{ steps.bauordner.outputs.pfad != '' }}
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.bauordner.outputs.pfad }}
          key: kodex-bau-v1-gate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: kodex-bau-v1-gate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Gate und Assistenten-Export unter Windows
        shell: pwsh
        env:
          BASIS: ${{ github.event.before }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $env:BASIS = python -B .github/scripts/kodex_nachweis.py basis
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo run --locked -p depot_lauf -- alles --basis "$env:BASIS"
          exit $LASTEXITCODE
      - name: Geprüften Bauordner für Folgeläufe speichern
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bauordner.outputs.pfad != '' && steps.gate-baucache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.bauordner.outputs.pfad }}
          key: kodex-bau-v1-gate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
      - name: Windows-Assistenten-Export bereitstellen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: assistant_export_windows
          path: assistant_export_latest.zip
          if-no-files-found: warn
          retention-days: 30

  kodex-windows-update:
    needs: [kodex-tor, windows-update-filter]
    if: ${{ !cancelled() && needs.kodex-tor.outputs.start == 'true' && needs.windows-update-filter.result == 'success' && needs.windows-update-filter.outputs.update == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Temporäre Dateien im Arbeitsbereich des Runners ablegen
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Zeilenenden beim Checkout festlegen
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Bauordner des Gates bestimmen
        id: bauordner
        shell: pwsh
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        run: ./.github/scripts/kodex_baucache.ps1 -Art update
      - name: Bauordner aus Cache laden
        id: gate-baucache
        if: ${{ steps.bauordner.outputs.pfad != '' }}
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.bauordner.outputs.pfad }}
          key: kodex-bau-v1-update-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: kodex-bau-v1-update-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Cache-Schlüssel für alten Updater bestimmen
        id: alt
        shell: pwsh
        run: |
          $commit = python .github/scripts/pruefe_update_alt.py --alt-commit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Alten Updater aus Cache laden
        id: cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/update-alt-bau/debug/depotschlopf.exe
          key: update-alt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.alt.outputs.commit }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Alter Updater bei laufendem Dienst
        shell: pwsh
        env:
          ALT_CACHE_TREFFER: ${{ steps.cache.outputs.cache-hit }}
        run: |
          $optionen = @()
          if ($env:ALT_CACHE_TREFFER -eq "true") {
            $optionen += "--cache-treffer"
          }
          python .github/scripts/pruefe_update_alt.py --isolierte-pruefmaschine --arbeit "$env:RUNNER_TEMP/depot-update-alt" --alt-bau "$env:RUNNER_TEMP/update-alt-bau" @optionen
          exit $LASTEXITCODE
      - name: Geprüften Bauordner für Folgeläufe speichern
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bauordner.outputs.pfad != '' && steps.gate-baucache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.bauordner.outputs.pfad }}
          key: kodex-bau-v1-update-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
      - name: Geprüften alten Updater für Folgeläufe speichern
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/update-alt-bau/debug/depotschlopf.exe
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Protokoll der Updater-Gegenprobe bereitstellen
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gegenprobe-update-windows
          path: ${{ runner.temp }}/depot-update-alt/gegenprobe.log
          if-no-files-found: ignore
          retention-days: 30

  kodex-windows:
    # Der bisherige Windows-Check bleibt das gemeinsame Ergebnis beider Prüfungen.
    needs: [kodex-tor, kodex-nachweis, windows-update-filter, kodex-windows-gate, kodex-windows-update]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Startfreigabe des Kodex-Tors prüfen
        env:
          TOR: ${{ needs.kodex-tor.result }}
          TOR_START: ${{ needs.kodex-tor.outputs.start }}
          TOR_GRUND: ${{ needs.kodex-tor.outputs.reason }}
        run: |
          printf 'Kodex-Tor: %s, Start: %s, Grund: %s\n' "$TOR" "$TOR_START" "$TOR_GRUND"
          test "$TOR" = success && test "$TOR_START" = true
      - name: Identischen grünen PR-Lauf übernehmen
        if: needs.kodex-nachweis.outputs.wiederverwendet == 'ja'
        run: echo "Windows-Prüfungen aus vollständig grünem PR-Lauf übernommen."
      - uses: actions/checkout@v5
        if: needs.kodex-nachweis.outputs.wiederverwendet != 'ja'
      - name: Beide Windows-Prüfungen bestätigen
        if: needs.kodex-nachweis.outputs.wiederverwendet != 'ja'
        env:
          FILTER: ${{ needs.windows-update-filter.result }}
          UPDATE_NOETIG: ${{ needs.windows-update-filter.outputs.update }}
          GATE: ${{ needs.kodex-windows-gate.result }}
          UPDATE: ${{ needs.kodex-windows-update.result }}
        run: python -B .github/scripts/windows_update.py sammelcheck

  kodex-pr-nachweis:
    needs: [kodex, kodex-windows, kodex-windows-update]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.kodex.result == 'success' && needs.kodex-windows.result == 'success' && needs.kodex-windows-update.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Geprüften Baum und seine Vergleichsbasis binden
        id: nachweis
        run: python -B .github/scripts/kodex_nachweis.py beleg
      - name: Geprüften Baum vermerken
        if: steps.nachweis.outputs.name != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.nachweis.outputs.name }}
          path: ${{ runner.temp }}/kodex-nachweis.txt
          if-no-files-found: error
          retention-days: 30

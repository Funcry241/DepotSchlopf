name: Kodex

on:
  pull_request:
  push:
    branches: [main]

# Ein neuer Stand desselben PRs macht dessen alte Prüfung überflüssig.
concurrency:
  group: kodex-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kodex-linux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Gate und Assistenten-Export (wie run.cmd)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASIS="origin/${{ github.base_ref }}"
          else
            BASIS="${{ github.event.before }}"
          fi
          cargo run --locked -p depot_lauf -- alles --basis "$BASIS"
      - name: Assistenten-Export bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant_export_latest
          path: assistant_export_latest.zip
          if-no-files-found: warn
          retention-days: 30

  kodex-linux-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Alter Updater bei laufendem Dienst
        run: python .github/scripts/pruefe_update_alt.py --isolierte-pruefmaschine --arbeit "$RUNNER_TEMP/depot-update-alt"

  kodex:
    # Der bisherige Linux-Check bleibt das gemeinsame Ergebnis beider Prüfungen.
    needs: [kodex-linux-gate, kodex-linux-update]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Beide Linux-Prüfungen bestätigen
        env:
          GATE: ${{ needs.kodex-linux-gate.result }}
          UPDATE: ${{ needs.kodex-linux-update.result }}
        run: |
          printf 'Linux-Gate: %s\nLinux-Update: %s\n' "$GATE" "$UPDATE"
          test "$GATE" = success && test "$UPDATE" = success

  kodex-windows-gate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Temporäre Dateien im Arbeitsbereich des Runners ablegen
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Zeilenenden beim Checkout festlegen
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Gate und Assistenten-Export unter Windows
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $basis = "origin/${{ github.base_ref }}"
          } else {
            $basis = "${{ github.event.before }}"
          }
          cargo run --locked -p depot_lauf -- alles --basis $basis
          exit $LASTEXITCODE
      - name: Windows-Assistenten-Export bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant_export_windows
          path: assistant_export_latest.zip
          if-no-files-found: warn
          retention-days: 30

  kodex-windows-update:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Temporäre Dateien im Arbeitsbereich des Runners ablegen
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Zeilenenden beim Checkout festlegen
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust-Werkzeugkette aus rust-toolchain.toml
        run: rustup toolchain install
      - name: Alter Windows-Updater bei laufendem Dienst
        shell: pwsh
        run: python .github/scripts/pruefe_update_alt.py --isolierte-pruefmaschine --arbeit "$env:RUNNER_TEMP/depot-update-alt"

  kodex-windows:
    # Der bisherige Windows-Check bleibt das gemeinsame Ergebnis beider Prüfungen.
    needs: [kodex-windows-gate, kodex-windows-update]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Beide Windows-Prüfungen bestätigen
        env:
          GATE: ${{ needs.kodex-windows-gate.result }}
          UPDATE: ${{ needs.kodex-windows-update.result }}
        run: |
          printf 'Windows-Gate: %s\nWindows-Update: %s\n' "$GATE" "$UPDATE"
          test "$GATE" = success && test "$UPDATE" = success

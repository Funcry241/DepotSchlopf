# Nur Messung für #325 Fragen 73-78 (Dachs). Läuft ausschließlich auf diesem Zweig, wird nie übernommen.
name: neuro-job-messung
on:
  push:
    branches: [claude/project-thread-acwn1d]
    paths: [".github/workflows/neuro-job-messung.yml", "werkzeuge/neurojob/**"]
permissions:
  contents: read
jobs:
  messen:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bauen
        shell: pwsh
        working-directory: werkzeuge/neurojob
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize /platform:x64 /out:kind.exe kind.cs
          & $csc /nologo /optimize /platform:x64 /out:messer.exe messer.cs
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Format-List
      - name: Messen
        shell: pwsh
        working-directory: werkzeuge/neurojob
        run: |
          # name rate faeden sekunden enkel zuordnen verschachtelt morgenlauf
          ./messer.exe W5b-gegenprobe-50-ungeprueft 5000 0 30 0 1 0 0

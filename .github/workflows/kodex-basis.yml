name: Kodex aus der Basis

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

jobs:
  pruefe:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Prüfung am Kandidaten vormerken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context=kodex-basis -f target_url="$RUN_URL"

      - name: Nur den Basisstand auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Kandidat als Git-Objekte holen
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Rust-Werkzeugkette der Basis verwenden
        run: rustup show

      - name: Kandidaten mit Basis-Kodex prüfen
        id: kandidat
        shell: bash
        run: |
          cargo build --locked -p depot_kodex
          protokoll="$RUNNER_TEMP/kodex-basis.txt"
          if target/debug/depot_kodex pruefe-pr --basis "$BASE_SHA" --kandidat "$HEAD_SHA" > "$protokoll" 2>&1; then
            cat "$protokoll"
            echo 'r30=ok' >> "$GITHUB_OUTPUT"
          else
            cat "$protokoll"
            if [[ $(<"$protokoll") == '[Kodex] Grenzfreigabe: erteilt ist "offen"' ]]; then
              echo 'r30=offen' >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi

      - name: Ergebnis am Kandidaten vermerken
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          R30: ${{ steps.kandidat.outputs.r30 }}
        run: |
          state=failure
          if [ "$JOB_STATUS:$R30" = success:ok ]; then
            state=success
          elif [ "$R30" != offen ]; then
            R30=fehler
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context=kodex-basis -f target_url="$RUN_URL" \
            -f description="head=$HEAD_SHA basis=$BASE_SHA R30=$R30 versuch=$GITHUB_RUN_ATTEMPT"

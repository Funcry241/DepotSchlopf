[workspace]
resolver = "3"
members = [
    "crates/depot_kern",
    "crates/depot_regelwerk",
    "crates/depot_ki",
    "crates/depot_journal",
    "crates/depot_sim",
    "crates/depot_kodex",
    "crates/depot_lauf",
    "crates/depot_sammler",
    "crates/depot_berater",
    "crates/depot_lage",
    "crates/depot_dienst",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Funcry241/DepotSchlopf"
homepage = "https://github.com/Funcry241/DepotSchlopf"
readme = "README.md"
keywords = ["trading", "depot", "risikomanagement", "ki", "regelwerk"]
categories = ["finance"]
authors = ["Funcry241"]
publish = false

[workspace.dependencies]
sha2 = "0.10"
# Nur depot_sammler und depot_berater: HTTPS ohne C-Bibliothek ausser ring, ohne Kompression.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# Nur depot_sammler und depot_berater unter Windows: Schluessel aus der
# Anmeldeinformationsverwaltung.
keyring-core = "1.0"
windows-native-keyring-store = { version = "1.1", default-features = false }
depot_kern = { path = "crates/depot_kern" }
depot_ki = { path = "crates/depot_ki" }
depot_journal = { path = "crates/depot_journal" }
depot_regelwerk = { path = "crates/depot_regelwerk" }
depot_kodex = { path = "crates/depot_kodex" }
depot_sim = { path = "crates/depot_sim" }
depot_lage = { path = "crates/depot_lage" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[profile.strict]
inherits = "release"
overflow-checks = true

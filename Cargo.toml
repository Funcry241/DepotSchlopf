[workspace]
resolver = "3"
members = [
    "crates/depot_kern",
    "crates/depot_regelwerk",
    "crates/depot_ki",
    "crates/depot_kodex",
    "crates/depot_lauf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Funcry241/DepotSchlopf"
homepage = "https://github.com/Funcry241/DepotSchlopf"
readme = "README.md"
keywords = ["trading", "depot", "risikomanagement", "ki", "regelwerk"]
categories = ["finance"]
authors = ["Funcry241"]
publish = false

[workspace.dependencies]
sha2 = "0.10"
depot_kern = { path = "crates/depot_kern" }
depot_ki = { path = "crates/depot_ki" }
depot_kodex = { path = "crates/depot_kodex" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[profile.strict]
inherits = "release"
overflow-checks = true
